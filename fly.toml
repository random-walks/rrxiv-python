# fly.toml — example Fly.io deploy config for the rrxiv reference server.
#
# This file is a REFERENCE; it points at a placeholder app name and
# leaves instance-specific env vars empty. Copy + edit for your own
# deployment, or use the canonical-instance overlay at
# random-walks/rrxiv-instance (private) as a template.
#
# To stand up your own instance:
#   fly apps create my-rrxiv-instance
#   fly volumes create rrxiv_data --region iad --size 1
#   fly secrets set \
#     RRXIV_API_BASE=https://api.example.com/api/v0 \
#     RRXIV_CORS_ORIGINS=https://example.com \
#     RRXIV_ORCID_CLIENT_ID=APP-... \
#     RRXIV_ORCID_CLIENT_SECRET=...
#   fly deploy

app = "rrxiv-api-example"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Only non-instance-specific defaults live here. RRXIV_API_BASE,
  # RRXIV_CORS_ORIGINS, and any OAuth secrets are set via `fly secrets`.
  RRXIV_STORE_URL = "sqlite:////data/rrxiv.db"
  RRXIV_DEV_MODE = "0"
  RRXIV_LOG_LEVEL = "info"

[[mounts]]
  source = "rrxiv_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/v0/version"
    protocol = "http"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
