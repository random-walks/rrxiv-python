[project]
name = "rrxiv"
version = "0.1.0"
description = "Reference Python client for the rrxiv protocol."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "rrxiv contributors" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic[email]>=2.5",
    "httpx>=0.27",
    "typer>=0.12",
    "pylatexenc>=2.10",
    "bibtexparser>=1.4",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
agent = [
    "cryptography>=48.0.1",
    "http-message-signatures>=2.0,<3",
]
cli = [
    "keyring>=25",
]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.31",
    "cryptography>=48.0.1",
    "http-message-signatures>=2.0,<3",
    # Optional error reporting. The SDK no-ops at runtime unless
    # SENTRY_DSN is set, so this dep is safe to include unconditionally.
    "sentry-sdk[fastapi]>=2.0",
    "prometheus-client>=0.20",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "datamodel-code-generator>=0.25",
    "cryptography>=48.0.1",
    "http-message-signatures>=2.0,<3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.31",
    "keyring>=25",
    "sentry-sdk[fastapi]>=2.0",
    # scripts/dump_openapi.py serialises the generated OpenAPI to YAML.
    "pyyaml>=6.0",
]

[project.scripts]
rrxiv = "rrxiv.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/rrxiv/models/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's idiomatic Depends/Header use function calls in argument
# defaults; ruff's B008 generally applies but is the wrong call here.
"src/rrxiv/server/**/*.py" = ["B008"]
# One-off curation scripts contain large embedded data strings where
# 100-char wrapping hurts readability.
"scripts/**/*.py" = ["E501"]
# The clean.py parser converts LaTeX `--` to `–` (en-dash) by design;
# the asserts in test_clean.py literally test for that en-dash. RUF001
# flags both as "ambiguous" but they're the subject of the test.
"src/rrxiv/parser/clean.py" = ["RUF001"]
"tests/test_clean.py" = ["RUF001"]
# Tests unpack (app, transport) from the _client() helper and often use
# only the transport; the unused `app` binding is intentional, not dead.
"tests/**/*.py" = ["RUF059"]

[tool.mypy]
strict = true
python_version = "3.11"
exclude = ["src/rrxiv/models/_generated"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = "rrxiv.models._generated.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["pylatexenc.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["http_message_signatures.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
