[project]
name = "rrvix"
version = "0.1.0"
description = "Reference Python client for the rrvix protocol."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "rrvix contributors" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
    "typer>=0.12",
    "pylatexenc>=2.10",
    "bibtexparser>=1.4",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "datamodel-code-generator>=0.25",
]

[project.scripts]
rrvix = "rrvix.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
